spring:
    application:
        name: expensetracker
    datasource:
        url: jdbc:h2:mem:expenses
        driverClassName: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate.format_sql: true

springdoc:
    swagger-ui:
        path: /swagger-ui
